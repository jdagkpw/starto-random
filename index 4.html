const member = MEMBERS[Math.floor(Math.random() * MEMBERS.length)];
const searchText = member.name + ' ' + member.group;
const searchUrl = 'https://ja.wikipedia.org/wiki/Special:Search?search=' + encodeURIComponent(searchText);

function showFallback(message) {
  document.body.innerHTML = '';
  const main = document.createElement('main');
  main.style.cssText = 'display:block;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:48px 22px;color:#292333';
  const name = document.createElement('h2');
  name.textContent = member.name.replace('(アイドル)', '');
  const group = document.createElement('p');
  group.textContent = member.group;
  const status = document.createElement('p');
  status.textContent = message;
  const link = document.createElement('a');
  link.href = searchUrl;
  link.textContent = 'Wikipediaでこのメンバーを検索';
  link.style.cssText = 'display:inline-block;margin:16px;padding:12px 18px;background:#8062b4;color:white;border-radius:24px;text-decoration:none';
  const again = document.createElement('button');
  again.textContent = 'もう一度抽選';
  again.style.cssText = 'display:block;margin:12px auto;padding:12px 18px;border:0;border-radius:24px;background:#eee9f5;color:#514663';
  again.addEventListener('click', () => location.reload());
  main.append(name, group, status, link, again);
  document.body.append(main);
}

async function run() {
  try {
    const api = new URL('https://ja.wikipedia.org/w/api.php');
    api.searchParams.set('action', 'query');
    api.searchParams.set('format', 'json');
    api.searchParams.set('formatversion', '2');
    api.searchParams.set('prop', 'info');
    api.searchParams.set('titles', member.name);
    api.searchParams.set('origin', '*');
    const response = await fetch(api.toString(), {cache: 'no-store'});
    if (!response.ok) throw new Error('Wikipedia API request failed');
    const data = await response.json();
    const page = data?.query?.pages?.[0];
    const normalize = value => String(value || '').normalize('NFC').replace(/_/g, ' ').trim();
    // Exact-title check only: no search-result guessing and no redirect resolution.
    if (page && !page.missing && normalize(page.title) === normalize(member.name)) {
      location.replace('https://ja.wikipedia.org/wiki/' + encodeURIComponent(page.title.replace(/ /g, '_')));
      return;
    }
    showFallback('本人の個別記事を確認できなかったため、自動移動はしません。');
  } catch (error) {
    showFallback('記事の確認ができませんでした。別人の記事へは移動しないので、検索リンクから確認してね。');
  }
}
run();
